<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>microhear</title>
    <style>
      :root { --bg: #fafaf7; --fg: #1d1d1b; --muted: #77756f; }
      @media (prefers-color-scheme: dark) { :root { --bg: #141413; --fg: #ecebe6; --muted: #8f8d86; } }
      body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg); font: 15px/1.5 ui-monospace, monospace; }
      main { max-width: 720px; margin: 0 auto; }
      p { color: var(--muted); }
      canvas { width: 100%; height: 200px; color: var(--fg); border-bottom: 1px solid var(--muted); }
      button { font: inherit; padding: 6px 14px; }
    </style>
  </head>
  <body>
    <main>
      <h1>microhear</h1>
      <p>how the duck hears. level per 32 ms frame, last 10 s.</p>
      <button id="start">start mic</button>
      <span id="level"></span>
      <canvas id="trace" width="1440" height="400"></canvas>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
